volumes:
  postgres-ppo-data:
  postgres-replica-ppo-data:
  redis-ppo-data:
  grafana-data:
  prometheus-data:
  pgadmin-data:

networks:
  pg_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
