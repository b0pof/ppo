worker_processes auto;
worker_rlimit_nofile 100000;

events {
    worker_connections 1024;
}

http {
    gzip on;
    gzip_disable "msie6";

    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript;

    proxy_cache_path /var/cache/nginx
        levels=1:2
        keys_zone=STATIC_CACHE:10m
        max_size=100m
        inactive=60m
        use_temp_path=off;

    proxy_no_cache 1;
    proxy_cache_bypass 1;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;

    add_header Server "Bizon" always;

    upstream backend {
        server host.docker.internal:8080;
    }

    map $http_upgrade $upgrade_connection {
        default upgrade;
        ''      close;
    }

    upstream main_read {
        server host.docker.internal:8080 weight=2 max_fails=3 fail_timeout=10s;
        server host.docker.internal:8081 weight=1 max_fails=3 fail_timeout=10s;
        server host.docker.internal:8082 weight=1 max_fails=3 fail_timeout=10s;
    }

    upstream main_write {
        server host.docker.internal:8080;
    }

    upstream mirror_read {
        server host.docker.internal:8083 weight=2 max_fails=3 fail_timeout=10s;
        server host.docker.internal:8084 weight=1 max_fails=3 fail_timeout=10s;
        server host.docker.internal:8085 weight=1 max_fails=3 fail_timeout=10s;
    }

    upstream mirror_write {
        server host.docker.internal:8083;
    }

    map $request_method $main_upstream {
        GET     main_read;
        HEAD    main_read;
        OPTIONS main_read;

        POST    main_write;
        PUT     main_write;
        PATCH   main_write;
        DELETE  main_write;

        default main_write;
    }

    map $request_method $mirror_upstream {
        GET     mirror_read;
        HEAD    mirror_read;
        OPTIONS mirror_read;

        POST    mirror_write;
        PUT     mirror_write;
        PATCH   mirror_write;
        DELETE  mirror_write;

        default mirror_write;
    }

    map $request_method $is_write {
        default 1;
        GET     0;
        HEAD    0;
        OPTIONS 0;
    }

    server {
        listen 80;
        server_name localhost;
        charset utf-8;

        location /health {
            proxy_pass http://backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location = /monitoring {
            return 301 /monitoring/;
        }

        location /monitoring/ {
            proxy_pass http://host.docker.internal:3000/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header X-Forwarded-Prefix /monitoring;
        }

        # 1. /api/v1 -> прокси на Swagger UI (/docs)
        location = /api/v1 {
            proxy_pass http://backend/docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /api/v1/... -> /api/1/...
        location /api/v1/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_no_cache 1;
            proxy_cache_bypass 1;

            rewrite ^/api/v1/(.*)$ /api/1/$1 break;

            proxy_pass http://$main_upstream;
        }

        # /mirror/api/v1/... -> /api/1/...
        location /mirror/api/v1/ {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Prefix /mirror;

            proxy_no_cache 1;
            proxy_cache_bypass 1;

            rewrite ^/mirror/api/v1/(.*)$ /api/1/$1 break;

            proxy_pass http://$mirror_upstream;
        }

        # 3. Swagger UI по прямому пути /docs
        location /docs {
            proxy_pass http://backend/docs/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. Спецификация API
        location /api/schema.yml {
            proxy_pass http://backend/api/schema.yml;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Все остальные API пути
        location /api/ {
            proxy_pass http://backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 6. Swagger assets
        location /swagger/ {
            proxy_pass http://backend/swagger/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Статика и другие location
        # 7. /documentation -> HTML версия Readme
        # /documentation -> HTML-рендер README.md
        location = /documentation/ {
            root /;
            try_files /usr/share/nginx/html/static/documentation.html =404;
        }

        location = /documentation/ {
            root /;
            try_files /usr/share/nginx/html/static/documentation.html =404;
        }

        location = /documentation/README.md {
            alias /usr/share/nginx/html/README.md;
            default_type text/markdown;
        }

        location /img/ {
            root /usr/share/nginx/html;
        }

        location ^~ /documentation/img/ {
            alias /usr/share/nginx/html/img/;
        }

        # 8. / -> статика (SPA)
        location / {
            root /usr/share/nginx/html/static;
            index index.html;
        }

        location ~* \.(jpg|jpeg|png|gif|css|js)$ {
            root /usr/share/nginx/html/static;
        }

        # 9. /reserved/ -> та же страница что и /
        location /reserved/ {
            rewrite ^ / last;
        }

        # 10. /admin -> pgadmin
        location /admin/ {
            return 302 http://localhost:8090/login?next=/;
        }

        # 11. /status -> статус nginx
        location = /status/raw {
            stub_status;
            access_log off;
            allow all;
        }

        # HTML страница
        location = /status {
            alias /usr/share/nginx/html/static/status.html;
            default_type text/html;
        }

        # 12. /management -> страница управления
        location = /management {
            root /usr/share/nginx/html/static;
            try_files /management.html =404;
        }

        location /download/cli {
            alias /usr/share/nginx/html/httpcli;
            default_type application/octet-stream;
            add_header Content-Disposition "attachment; filename=httpcli";
        }
    }
}

