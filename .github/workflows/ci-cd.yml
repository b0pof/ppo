  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
#    needs: unit-tests
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
          cache: true
          cache-dependency-path: go.sum

      - name: Install golurectl
        run: go install github.com/robotomize/go-allure/cmd/golurectl@latest

      - name: Run E2E Tests
        run: |
          if [ -z "$GMAIL_ADDRESS" ]; then
            echo "::error::GMAIL_ADDRESS is not set"
            exit 1
          fi
          if [ -z "$GMAIL_APP_PASSWORD" ]; then
            echo "::error::GMAIL_APP_PASSWORD is not set"
            exit 1
          fi
          echo "Secrets are properly configured"
          make e2e-test

      - name: Upload E2E Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-e2e
          path: report/e2e-allure-results
