name: Run Go Tests with Allure

on:
  push:
    branches:
      - main

jobs:
  quality-checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
          cache: true
          cache-dependency-path: go.sum

      - name: Install quality tools
        run: |
          make install-tools

      - name: Run quality checks
        run: |
          make quality

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: quality-checks
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25
          cache: true
          cache-dependency-path: go.sum

      - name: Install golurectl
        run: go install github.com/robotomize/go-allure/cmd/golurectl@latest

      - name: Run Unit Tests
        run: |
          make unit-test

      - name: Upload Unit Allure Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-unit
          path: report/unit-allure-results
