server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: backend
    static_configs:
      - targets:
          - localhost
        labels:
          job: backend
          __path__: /logs/*.log
    pipeline_stages:
      - json:
          expressions:
            time: time
            level: level
            msg: msg
            method: method
            uri: uri
            statusCode: statusCode
            requestID: requestID
            duration: duration
      - labels:
          level:
          method:
      - timestamp:
          source: time
          format: RFC3339Nano
